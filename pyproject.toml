[project]
name = "pata"
version = "1.0.0"
description = "Pata: an evidence-first Norwegian company research agent for the Builderr Signalpost challenge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<7",
  "dnspython>=2.7,<3",
  "protego>=0.7.0",
]

[project.scripts]
pata = "pata.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pata"]
