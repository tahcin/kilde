    <!-- If a deploy replaced the app's files while this page was open or cached, reload once to get the new ones. -->
    <script>
      addEventListener("error", function (e) {
        var t = e.target;
        if (!t || !(t.tagName === "SCRIPT" || t.tagName === "LINK") || !/\/assets\//.test(t.src || t.href || "")) return;
        try { if (sessionStorage.getItem("kilde.reloaded")) return; sessionStorage.setItem("kilde.reloaded", "1"); } catch (_) { return; }
        location.reload();
      }, true);
      addEventListener("unhandledrejection", function (e) {
        if (!/dynamically imported module|Importing a module script failed/i.test(String(e.reason && e.reason.message))) return;
        try { if (sessionStorage.getItem("kilde.reloaded")) return; sessionStorage.setItem("kilde.reloaded", "1"); } catch (_) { return; }
        location.reload();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:system-ui">Kilde needs JavaScript. The code and data are at github.com/tahcin/kilde.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
